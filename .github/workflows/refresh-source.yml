name: Refresh Studio Monitor source

on:
  push:
    paths:
      - '.refresh-v1018/READY'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild repository from uploaded v1.0.18 source
        shell: bash
        run: |
          set -euo pipefail
          cp -f studio_monitor.ico /tmp/studio_monitor_icon.ico 2>/dev/null || cp -f studio_monitor_icon.ico /tmp/studio_monitor_icon.ico 2>/dev/null || true
          cp -f studio_monitor_icon.png /tmp/studio_monitor_icon.png 2>/dev/null || true
          cat .refresh-v1018/source-part-* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/source.tar.gz
          mkdir -p /tmp/release
          tar --warning=no-timestamp -xzf /tmp/source.tar.gz -C /tmp/release
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/release/. .
          if [ -f /tmp/studio_monitor_icon.ico ]; then cp -f /tmp/studio_monitor_icon.ico studio_monitor_icon.ico; fi
          if [ -f /tmp/studio_monitor_icon.png ]; then cp -f /tmp/studio_monitor_icon.png studio_monitor_icon.png; fi
          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          build/
          dist/
          release-package/
          *.spec
          studio_monitor_config.json
          studio-monitor-bootstrap.log
          studio_monitor.pid
          RadioBOSS-Studio-Monitor-v*-Windows.zip
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update RadioBOSS Studio Monitor to v1.0.18 LED/VU' || exit 0
          git push
