name: Finalize Studio Monitor v1.0.14

on:
  push:
    branches: [main]
    paths:
      - 'tools/apply-v1.0.14/**'
      - '.github/workflows/apply-v1.0.14.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v1.0.14 source patches
        shell: bash
        run: |
          set -euo pipefail
          git apply --check tools/apply-v1.0.14/native.patch
          git apply tools/apply-v1.0.14/native.patch
          git apply --check tools/apply-v1.0.14/backend.patch
          git apply tools/apply-v1.0.14/backend.patch
          test "$(git hash-object StudioMonitorNative.py)" = "77c8b16fa53256d3e3bb27907ac6de555b6e2342"
          test "$(git hash-object studio_monitor_backend.py)" = "2fc54aa7269576768444f2bb1d93076140ff3615"

      - name: Run recovery tests
        run: |
          python selftest.py
          python test_connection_recovery.py

      - name: Generate final application icons
        run: |
          python -m pip install --disable-pip-version-check pillow==12.3.0
          python tools/apply-v1.0.14/generate_icons.py
          test "$(git hash-object studio_monitor_icon.png)" = "ad9dcc64ed4ee09fc2d246281b26387a9bb5f45d"
          test "$(git hash-object studio_monitor.ico)" = "b04c94aa23a38c23e15871033322221f2b99015a"

      - name: Commit final v1.0.14 tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/apply-v1.0.14
          rm -f .github/workflows/apply-v1.0.14.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize RadioBOSS Studio Monitor v1.0.14 Freeware"
          git push origin HEAD:main
